# analytics.maas.click — Umami Analytics subdomain（T08-1A Gate A 模板）
#
# 安装方式（P1 修复：不安装注释掉的 ssl_certificate，避免 repo/生产漂移）：
#   install-umami.sh --render-nginx <cert-path> <key-path> 渲染完整 config
#   （从本模板用 sed 取消注释并填入真实证书路径）→ 安装到 /etc/nginx/conf.d/
#
# 作用域边界：独立 server block，只服务 analytics.maas.click 子域名，
# 不影响现有 daily.maas.click 主站与 agent-api 路由。Umami backend 仅监听
# 127.0.0.1:3000，公网只通过本 HTTPS endpoint 暴露。
#
# ⚠️ OWNER ACTION REQUIRED（Gate B prerequisite，分阶段执行）：
#   Phase 1: DNS analytics.maas.click → 47.237.135.97（A 记录）
#   Phase 2: certbot certonly -d analytics.maas.click（获取证书路径）
#   Phase 3: ops/install-umami.sh --render-nginx <cert-path> <key-path>
#   Phase 4: nginx -t（install-umami.sh Phase 3 后自动执行）
#   Phase 5: nginx -s reload（同上）
#   Phase 6: systemctl enable --now maas-umami.service
#   Phase 7: curl http://127.0.0.1:3000/api/heartbeat（验证 Umami 健康）

server {
    listen 443 ssl http2;
    server_name analytics.maas.click;

    # TLS 证书：由 install-umami.sh --render-nginx <cert> <key> 渲染填入
    # 渲染后：ssl_certificate <cert-path>;
    # 渲染后：ssl_certificate_key <key-path>;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# HTTP → HTTPS 重定向（analytics.maas.click:80 → 443）
server {
    listen 80;
    server_name analytics.maas.click;
    return 301 https://$host$request_uri;
}
