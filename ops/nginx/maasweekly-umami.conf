# maasweekly-umami.conf：Umami Analytics subdomain nginx 配置（T08-1A Gate A 候选）
#
# 安装位置：/etc/nginx/conf.d/maasweekly-umami.conf（http context，独立 server block）
# 由 install-umami.sh 安装（Gate B 授权后在生产服务器执行）。
#
# 作用域边界：本文件是独立 server block，只服务 analytics.maas.click 子域名，
# 不影响现有 daily.maas.click 主站（maasweekly-https.conf）与 agent-api 路由
# （maasweekly-agent-*.conf）。Umami backend 仅监听 127.0.0.1:3000，
# 公网只通过本 HTTPS endpoint 暴露。
#
# ⚠️ OWNER ACTION REQUIRED（Gate B prerequisite）：
#   1. DNS：analytics.maas.click → 47.237.135.97（A 记录）
#   2. TLS 证书：certbot certonly --nginx -d analytics.maas.click
#      （或 dns-01 challenge；证书路径写入下方 ssl_certificate 行）
#   3. nginx -t 通过后 reload（install-umami.sh Gate B 执行）

server {
    listen 443 ssl http2;
    server_name analytics.maas.click;

    # TLS 证书（Gate B 由 owner 配置 certbot 后取消注释；路径以 certbot 输出为准）
    # ssl_certificate /etc/letsencrypt/live/analytics.maas.click/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/analytics.maas.click/privkey.pem;

    # Umami dashboard 默认无 auth（Umami 自带登录）；如需额外 Basic Auth 保护，
    # T08-7 在此 location 加 auth_basic（本任务不实现）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        # Next.js 需要 HTTP/1.1 + Upgrade（HMR/dev 用；生产 keepalive）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 超时
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# HTTP → HTTPS 重定向（analytics.maas.click:80 → 443）
server {
    listen 80;
    server_name analytics.maas.click;
    return 301 https://$host$request_uri;
}
