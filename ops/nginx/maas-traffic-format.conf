# Install in nginx http context; use with a dedicated MaaS server access_log.
# Query strings, cookies, authorization and raw referrer are deliberately omitted.
log_format maas_traffic escape=json
  '{"time":"$time_iso8601","host":"$host","method":"$request_method",'
  '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"duration":$request_time,"agent":"$http_user_agent"}';
# In each MaaS server block:
# access_log /var/log/nginx/maas-traffic.log maas_traffic;
# No IP is stored: this log measures requests, never unique visitors.
