# maasweekly-agent-http.conf：http context 稳定配置（Task 06 M8-B3 P0）
#
# 安装位置：/etc/nginx/conf.d/maasweekly-agent.conf
# 由 nginx.conf 的 http 块 include（include /etc/nginx/conf.d/*.conf;）。
#
# 作用域红线：本文件只允许 http-context 指令（limit_req_zone、include）。
# 禁止出现 server {}、location、root——server 级内容在
# snippets/maasweekly-agent.conf，动态内容由激活器维护的三个 include 承担：
#   /srv/maasweekly/shared/nginx/agent-upstream.inc   （本文件 include，http ctx）
#   /srv/maasweekly/shared/nginx/site-root.inc        （maasweekly-https.conf include）
#   /srv/maasweekly/shared/nginx/agent-routes.inc     （snippets/maasweekly-agent.conf include）

# REST 匿名限流（应用层 Problem JSON 合同不变；nginx 层独立保守桶）
limit_req_zone $binary_remote_addr zone=api_anon:10m rate=2r/s;

# MCP 独立限流（不消耗 REST 桶）
limit_req_zone $binary_remote_addr zone=mcp_anon:10m rate=1r/s;

# API upstream（激活器事务原子切换 blue 8788 / green 8789）
include /srv/maasweekly/shared/nginx/agent-upstream.inc;
