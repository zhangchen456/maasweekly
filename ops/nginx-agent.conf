# nginx-agent.conf：candidate 配置模板（Task 06 M7；安装位置
# /etc/nginx/sites-available/maasweekly-agent.conf，被主 server include）
#
# 这是【候选配置 diff 的一部分】，不是已生效配置。生产 nginx 改造最小化：
#   1. 现有 server 块（daily.maas.click 的 TLS/旧域名/静态缓存）保持不动
#   2. 本文件提供三类新 location：/api/v1/（REST）、/api/mcp（MCP）、
#      feed/Skill 行为头；upstream/root 由激活器维护的 include 绑定
#      （shared/nginx/agent-upstream.inc —— root 与 upstream 同一 release）
#   3. include 进主 server 后 nginx -t 必须通过（激活器内置，P0 复验）
#
# upstream/静态 root 不在此文件硬编码 —— 蓝绿切换时由 maasweekly-activate
# 原子替换 shared/nginx/agent-upstream.inc：
#   root /srv/maasweekly/releases/<rid>/site;
#   upstream agent_api { server 127.0.0.1:8788; }   # blue=8788 green=8789

# ---- REST（§8.1）：只代理回环，GET/HEAD/OPTIONS，错误不缓存 ----
# 独立保守限流（应用层 Problem JSON 合同不变；nginx 429 边界已记录）
limit_req_zone $binary_remote_addr zone=api_anon:10m rate=2r/s;

# ---- MCP（§8.2）：独立限流桶，不消耗 REST ----
limit_req_zone $binary_remote_addr zone=mcp_anon:10m rate=1r/s;

server {
    # 由现有主 server 提供 listen/server_name/TLS —— 本文件按 include 片段
    # 组织；install-production.sh 会把 location 块并入主 server（diff 见
    # task-06-result.md M7 授权包）。

    # include 激活器维护的绑定（root + upstream 同 release，原子切换）
    include /srv/maasweekly/shared/nginx/agent-upstream.inc;

    # ---------- REST /api/v1/ ----------
    location /api/v1/ {
        limit_req zone=api_anon burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://agent_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # 应用层已输出 ETag/Cache-Control/Vary/Retry-After；错误不进共享缓存
        proxy_cache off;
        proxy_buffering on;   # ETag/304 头处理
        # 只保留应用支持的方法；其余 404（应用 Problem JSON）
        limit_except GET HEAD OPTIONS { deny all; }
    }

    # ---------- MCP /api/mcp ----------
    location = /api/mcp {
        limit_req zone=mcp_anon burst=5 nodelay;
        limit_req_status 429;
        # 与应用 MCP_MAX_BODY_BYTES 一致
        client_max_body_size 256k;
        proxy_pass http://agent_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;   # Streamable HTTP 长连接
        # §8.2：POST no-store、不进 proxy cache
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        # 只允许 POST/GET/HEAD/DELETE/PUT（MCP 协议层；应用校验内容）
        limit_except POST GET HEAD DELETE PUT { deny all; }
    }

    # ---------- RSS（§8.3）：content type、30 分钟缓存、稳定 ETag ----------
    location = /feed.xml {
        root /srv/maasweekly/current/site;
        default_type application/rss+xml; charset utf-8;
        add_header Cache-Control "public, max-age=1800";
        etag on;
        if_modified_since exact;
    }
    location = /feed/weekly.xml {
        root /srv/maasweekly/current/site;
        default_type application/rss+xml; charset utf-8;
        add_header Cache-Control "public, max-age=1800";
        etag on;
        if_modified_since exact;
    }

    # ---------- Skill 包 / OpenAPI / llms.txt（§8.3：同 release 提供） ----------
    location /maas-skill/ {
        root /srv/maasweekly/current/site;
        add_header Cache-Control "public, max-age=300";
    }

    # ---------- /_astro/ 一年 immutable；HTML no-cache（对齐现有静态行为） ----------
    location /_astro/ {
        root /srv/maasweekly/current/site;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
