<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 88" role="img" aria-label="MaaS Daily" style="color:#172724"><style>.trace{animation:draw .85s cubic-bezier(.22,1,.36,1) both}.dot{transform-origin:66px 66px;animation:arrive .35s .65s both}svg:hover .signal-ring{animation:signal .8s ease-out}svg:hover .signal-tick{animation:scan .8s cubic-bezier(.22,1,.36,1);transform-origin:66px 66px}@keyframes draw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}@keyframes arrive{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}@keyframes signal{0%{r:9;opacity:.3}65%{r:12;opacity:0}100%{r:9;opacity:.3}}@keyframes scan{from{transform:rotate(-90deg)}to{transform:rotate(0deg)}}@media(prefers-reduced-motion:reduce){.trace,.dot,svg:hover .signal-ring,svg:hover .signal-tick{animation:none}}</style><path class="trace" d="M14 66V24L40 51L66 24V66" fill="none" stroke="currentColor" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" pathLength="1"/><g class="dot"><circle class="signal-ring" cx="66" cy="66" r="9" fill="none" stroke="#078F78" stroke-width="1.2" opacity=".3"/><path class="signal-tick" d="M66 57A9 9 0 0 1 75 66" fill="none" stroke="#078F78" stroke-width="1.8" stroke-linecap="round"/><circle cx="66" cy="66" r="6" fill="#078F78"/><circle cx="66" cy="66" r="2" fill="#B5F2DD"/></g></svg>