name: 每日信源抓取与站点更新

# 每天北京时间凌晨 05:00（UTC 21:00 前一日）抓取全部信源，产出 diff，
# 同步到站点数据源并构建部署到 aliyun-099（daily.maas.click，旧域名 301 跳转）。
# 也支持手动触发。
on:
  schedule:
    - cron: '0 21 * * *'  # UTC 21:00（前一日）= 北京时间 05:00
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: '跳过抓取，仅重新构建站点'
        type: boolean
        default: false

permissions:
  contents: write

# 同一时间只允许一个实例，避免并发抓取写快照
concurrency:
  group: daily-update
  cancel-in-progress: false

env:
  DEPLOY_HOST: 47.237.135.97
  DEPLOY_USER: maasdeploy
  DEPLOY_PATH: /var/www/maasweekly/

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      # ---- 1. 抓取信源（可跳过）----
      - name: Fetch sources & generate diff
        if: ${{ !inputs.skip_fetch }}
        run: python3 pipeline/scripts/fetch_sources.py
        env:
          TZ: Asia/Shanghai

      # ---- 2. 同步 diff 数据到站点（含 diff_clean 降噪/配对/分类）----
      - name: Sync diff data to site
        if: ${{ !inputs.skip_fetch }}
        run: python3 pipeline/scripts/sync-diff-to-site.py

      # ---- 2.2 LLM 提炼"今日要点"（失败不阻塞，前端回退规则版预览）----
      - name: LLM digest highlights
        if: ${{ !inputs.skip_fetch }}
        run: python3 pipeline/scripts/llm-digest.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        continue-on-error: true

      # ---- 2.3 OpenRouter 榜单数据抓取（CC BY 4.0；失败不阻塞，保留旧快照）----
      - name: Fetch leaderboards data
        if: ${{ !inputs.skip_fetch }}
        run: python3 pipeline/scripts/fetch-leaderboards.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        continue-on-error: true

      # ---- 3. 抓取文章配图（可选，失败不阻塞）----
      - name: Fetch article images
        if: ${{ !inputs.skip_fetch }}
        run: python3 site/scripts/fetch-images.py
        continue-on-error: true

      # ---- 4. 构建站点 ----
      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build

      # ---- 5. 部署到 aliyun-099 ----
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: rsync -az --delete site/dist/ ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}

      # ---- 6. 把新抓取的数据提交回仓库（快照+diff+站点数据源）----
      - name: Commit new data
        if: ${{ !inputs.skip_fetch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ site/src/data/
          # live_feeds.json 也在 site/src/data/ 下，包含提炼事件，一并提交
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "data: 每日信源抓取 $(date +'%Y-%m-%d')"
            git push
          fi
