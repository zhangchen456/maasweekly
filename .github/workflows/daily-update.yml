name: 每日信源抓取与站点更新
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: '跳过抓取，从数据库重新发布数据'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  data-update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    concurrency:
      group: maas-data-write-main
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: ops
      - name: Configure fixed SSH destination
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Collect, validate and publish independent data
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SKIP_FETCH: ${{ inputs.skip_fetch }}
        run: |
          MODE=update
          if [ "$SKIP_FETCH" = true ]; then MODE=rebuild; fi
          python3 ops/request-data-update.py --mode "$MODE"
