name: 线上更新（构建部署）

# 轻量部署工作流：只构建 + rsync 到 aliyun-099，不抓取数据。
# 触发方式：
#   1. push 到 main（代码改动即时上线；Actions 自动提交的数据文件不触发，避免循环）
#   2. 手动触发（无服务器权限的协作者通过这里部署）
#
# 有 aliyun-099 访问权限的人也可以本地直连部署（效果等价）：
#   cd site && npm run build
#   rsync -az --delete dist/ maasdeploy@47.237.135.97:/var/www/maasweekly/
#   （或 root 身份：rsync -az --delete site/dist/ aliyun-099:/var/www/maasweekly/）

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'              # Actions 定时提交的快照/diff 数据，不触发
      - 'site/src/data/**'     # 同上：同步脚本产出的站点数据源
      - 'README.md'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  DEPLOY_HOST: 47.237.135.97
  DEPLOY_USER: maasdeploy
  DEPLOY_PATH: /var/www/maasweekly/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: rsync -az --delete site/dist/ ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}
