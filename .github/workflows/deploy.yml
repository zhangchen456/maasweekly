name: 线上更新（构建部署）

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: '固定的 main 候选 SHA（空时使用本次触发 SHA；旧运行版本用标准 rollback）'
        type: string
        default: ''
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
      import_weekly: ${{ steps.changes.outputs.import_weekly }}
      sha: ${{ steps.changes.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect deployable changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          TRIGGER_SHA: ${{ github.sha }}
          REQUESTED_SHA: ${{ inputs.commit }}
        run: |
          SHA="${REQUESTED_SHA:-$TRIGGER_SHA}"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            RESULT='{"deploy":true,"importWeekly":false}'
          else
            RESULT=$(python3 scripts/workflow-policy.py trigger --before "$BEFORE_SHA" --after "$TRIGGER_SHA")
          fi
          echo "$RESULT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "deploy=$(echo "$RESULT" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["deploy"]).lower())')" >> "$GITHUB_OUTPUT"
          echo "import_weekly=$(echo "$RESULT" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["importWeekly"]).lower())')" >> "$GITHUB_OUTPUT"
  import-weekly:
    needs: changes
    if: needs.changes.outputs.import_weekly == 'true'
    uses: ./.github/workflows/weekly-update.yml
    with:
      mode: import
    secrets: inherit
    permissions:
      contents: write
  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true' && needs.changes.outputs.import_weekly != 'true'
    uses: ./.github/workflows/release-deploy.yml
    with:
      commit: ${{ needs.changes.outputs.sha }}
    secrets: inherit
