name: 线上更新（构建部署）

# 轻量部署工作流：只构建 + rsync 到 aliyun-099，不抓取数据。
# 触发方式：
#   1. push 到 main（job 内自查改动范围：代码改动才部署，纯数据提交跳过）
#   2. 手动触发（无服务器权限的协作者通过这里部署）
#
# 有 aliyun-099 访问权限的人也可以本地直连部署（效果等价）：
#   cd site && npm run build
#   rsync -az --delete dist/ maasdeploy@47.237.135.97:/var/www/maasweekly/
#   （或 root 身份：rsync -az --delete site/dist/ aliyun-099:/var/www/maasweekly/）

on:
  # 不用 paths 过滤：GitHub 的 paths 匹配在大 push（>3000 文件）下只检查
  # diff 前 3000 个文件，归档数据提交动辄数千文件，代码改动排在后面时
  # workflow 会静默不触发（官方文档明确此限制）。改为 push 一律触发，
  # job 内用 git diff 自查改动范围，纯数据提交自动跳过。
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  DEPLOY_HOST: 47.237.135.97
  DEPLOY_USER: maasdeploy
  DEPLOY_PATH: /var/www/maasweekly/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 取全量历史：改动自查需要 diff push 的 before..after 范围
          fetch-depth: 0

      - name: Detect deployable changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发，直接部署"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          # before 不可得（新建分支/仓库初始 push）→ fail-open 部署
          if ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "before SHA 不存在（force push/初始 push），fail-open 部署"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # T14 触发范围反转：默认部署。仅以下可忽略路径跳过——
          #   data/**、site/src/data/**、research、docs/blog、README、HANDOFF、
          #   所有 .md。除此之外的改动均触发，包括：
          #   site/**、pipeline、ops、.github、services、contracts、package*.json。
          # quotepath=off：中文路径默认输出带引号的八进制，会绕过前缀匹配。
          git -c core.quotepath=off diff --name-only "$BEFORE" "$AFTER" > /tmp/changed.txt || true
          # 可忽略的正则（忽略即跳过；不在此处的全部触发）
          IGNORE_RE='^(data/|site/src/data/|research/|docs/blog/|README\.md$|HANDOFF\.md$|.*\.md$)'
          DEPLOYABLE=$(grep -vE "$IGNORE_RE" /tmp/changed.txt || true)
          if [ -z "$DEPLOYABLE" ]; then
            echo "改动全部落在可忽略范围（数据/研究/纯 markdown），跳过部署："
            head -10 /tmp/changed.txt
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "触发部署的改动："
            echo "$DEPLOYABLE" | head -20
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Build site
        if: steps.changes.outputs.deploy == 'true'
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        if: steps.changes.outputs.deploy == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 受控 host key（管理员核验后提交）——不用 ssh-keyscan 运行时抓取
          cp ops/known_hosts.production ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy via rsync
        if: steps.changes.outputs.deploy == 'true'
        run: rsync -az --delete -e "ssh -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes" site/dist/ ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}
