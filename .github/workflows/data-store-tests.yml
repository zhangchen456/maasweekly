name: Data store integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: maas_shadow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maas_shadow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            pipeline
            config
            tests
            ops
            scripts
            schemas
            packages
            site
            services
            agent-skill
            data/model-registry
            data/weekly
            docs/weekly-reviews
            docs/product
            docs/operations/cross-platform-2026-10-02/evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock.txt -r requirements.shadow.lock.txt
      - name: Unified runtime gate
        env:
          MAAS_SHADOW_TEST_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=maas_shadow_test
        run: python scripts/test-runtime.py --require-postgres
      - name: Operational shell syntax
        run: bash -n ops/provision-data-store.sh ops/backup-data-store.sh ops/import-shadow-bundle.sh ops/runtime-job.sh ops/data-writer/job.sh ops/server/maasweekly-activate ops/server/maasweekly-deploy-shell
