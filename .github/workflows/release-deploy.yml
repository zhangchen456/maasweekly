name: 独立代码发布
on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
    secrets:
      DEPLOY_SSH_KEY:
        required: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    concurrency:
      group: maas-production-deploy-main
      cancel-in-progress: false
      queue: max
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: maas_shadow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d maas_shadow_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MAAS_SHADOW_TEST_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=maas_shadow_test
    steps:
      - name: Checkout code and small configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          filter: blob:none
          fetch-depth: 0
          sparse-checkout: |
            .github
            agent-skill
            config
            data/model-registry
            ops
            packages
            pipeline
            schemas
            scripts
            services
            site
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            services/agent-api/package-lock.json
      - name: Confirm exact eligible main code
        id: candidate
        env:
          CANDIDATE_SHA: ${{ inputs.commit }}
        run: |
          git fetch --no-tags --filter=blob:none origin main
          RESULT=$(python3 scripts/workflow-policy.py candidate --sha "$CANDIDATE_SHA")
          echo "$RESULT"
          echo "eligible=$(echo "$RESULT" | python3 -c 'import json,sys;print(str(json.load(sys.stdin)["eligible"]).lower())')" >> "$GITHUB_OUTPUT"
      - name: Install locked Python dependencies
        if: steps.candidate.outputs.eligible == 'true'
        run: pip install -r requirements.lock.txt -r requirements.shadow.lock.txt
      - name: Database, publication and deployment contracts
        if: steps.candidate.outputs.eligible == 'true'
        run: |
          python -m unittest discover -s tests -p 'test_shadow*.py'
          python -m unittest discover -s tests -p test_data_publication.py
          python -m unittest discover -s tests -p test_database_writer.py
          python -m unittest discover -s tests -p test_import_memory.py
          python -m unittest discover -s tests -p test_runtime_control.py
          python -m unittest discover -s tests -p test_runtime_package.py
          python -m unittest discover -s tests -p test_workflow_release_contract.py
      - name: Validate English translations
        if: steps.candidate.outputs.eligible == 'true'
        run: |
          python -m unittest discover -s tests -p test_english_translation.py
          node scripts/ensure-node-deps.mjs site
          npm --prefix site run test:english
      - name: Build code-only runtime
        if: steps.candidate.outputs.eligible == 'true'
        run: bash scripts/build-runtime-release.sh --output "$RUNNER_TEMP/runtime"
      - name: Configure fixed SSH destination
        if: steps.candidate.outputs.eligible == 'true'
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Upload, verify Linux runtime and switch slots
        id: deploy
        if: steps.candidate.outputs.eligible == 'true'
        env:
          CANDIDATE_SHA: ${{ inputs.commit }}
        run: |
          git fetch --no-tags --filter=blob:none origin main
          ELIGIBLE=$(python3 scripts/workflow-policy.py candidate --sha "$CANDIDATE_SHA" | python3 -c 'import json,sys;print(str(json.load(sys.stdin)["eligible"]).lower())')
          if [ "$ELIGIBLE" != true ]; then echo 'superseded code candidate'; exit 0; fi
          RID="rl_${CANDIDATE_SHA:0:10}_000000000000"
          rsync -az -e "ssh -i $HOME/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=120 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=ops/known_hosts.production" "$RUNNER_TEMP/runtime/" "maasdeploy@47.237.135.97:/srv/maasweekly/incoming/$RID/"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=120 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=ops/known_hosts.production maasdeploy@47.237.135.97 "runtime-activate $RID"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Verify public entry points
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          curl --fail --silent --show-error --max-time 30 https://daily.maas.click/api/v1/status
          curl --fail --silent --show-error --max-time 30 https://daily.maas.click/feed.xml > /dev/null
