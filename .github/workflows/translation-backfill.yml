name: Spark English translation backfill
on:
  push:
    branches: [codex/en-translation-retry-20261031]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Translate display text with existing Spark credentials
        run: python3 pipeline/scripts/translate-ui-en.py --cache /tmp/ui-en-cache.json --batch-only
        env:
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_MODEL: spark-x2.5
          TRANSLATION_WORKERS: 12
      - uses: actions/upload-artifact@v4
        with:
          name: spark-english-batch
          path: site/src/data/ui-translations-en.json
      - name: Retry remaining texts in short validated passages
        run: python3 pipeline/scripts/translate-ui-en.py --cache /tmp/ui-en-cache.json --retry-only
        env:
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_MODEL: spark-x2.5
          TRANSLATION_WORKERS: 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spark-english-translations
          path: |
            site/src/data/ui-translations-en.json
            /tmp/ui-en-cache.json
          retention-days: 7
