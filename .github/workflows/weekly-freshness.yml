name: 正式周报每日时效检查
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ops
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 ops/check-formal-weekly.py
