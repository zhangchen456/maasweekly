name: 周报数据准备
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'aggregate只准备素材；import导入稿件；full完整更新'
        type: choice
        default: aggregate
        options: [aggregate, import, full]
  workflow_call:
    inputs:
      mode:
        type: string
        default: import
permissions:
  contents: read
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    concurrency:
      group: maas-data-write-main
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            ops
            data/weekly
      - name: Configure fixed SSH destination
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Publish weekly data without a code build
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          case "$REQUESTED_MODE" in
            aggregate) MODE=aggregate ;;
            import) MODE=import ;;
            full|'') MODE=weekly ;;
            *) exit 2 ;;
          esac
          python3 ops/request-data-update.py --mode "$MODE" --drafts data/weekly
